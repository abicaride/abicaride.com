<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Writing · Sveltia CMS</title>
  </head>
  <body>
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/@sveltia/cms@0.221.1/dist/sveltia-cms.js"></script>
    <script>
      const localEditor = ['localhost', '127.0.0.1'].includes(window.location.hostname);

      CMS.init({
        config: {
          site_url: window.location.origin,
          show_preview_links: localEditor,
        },
      });
    </script>
  </body>
</html>
