media:
  - name: project_images
    label: Project images
    input: src/assets/images/projects
    output: ../../../assets/images/projects
    categories: [image]
    extensions: [jpg, jpeg, png, webp, avif]
    rename: safe
  - name: writing_images
    label: Writing images
    input: src/assets/images/writing
    output: ../../../assets/images/writing
    categories: [image]
    extensions: [jpg, jpeg, png, webp, avif]
    rename: safe

components:
  project_title:
    label: Title
    type: string
    required: true

  project_description:
    label: Description
    type: text
    required: true
    description: Localized summary used on project listings and in page metadata.

  project_route_slug:
    label: Route slug
    type: string
    required: true
    pattern:
      regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      message: Use lowercase letters, numbers and single hyphens only.
    description: Preserve existing localized slugs unless the public URL should intentionally change.

  project_translation_key:
    label: Translation key
    type: string
    required: true
    description: Must match the corresponding project in the other language. Changing it can break EN/ES pairing.

  project_category:
    label: Category
    type: string
    required: true

  project_year:
    label: Year
    type: number
    description: Optional whole-number year. Astro validates that the value is an integer.

  project_company:
    label: Company
    type: string

  project_client:
    label: Client
    type: string

  project_role:
    label: Role
    type: string

  project_period:
    label: Period
    type: string
    description: Optional human-readable period, for example 2023–2024.

  project_featured:
    label: Featured
    type: boolean
    default: false
    description: Controls prominent/homepage placement. Enable only after the project and its translated pair have been reviewed.

  project_order:
    label: Display order
    type: number
    required: true
    description: Positive whole number controlling listing order. Keep intentional ordering aligned across the translated pair.
    options:
      min: 1

  project_draft:
    label: Draft
    type: boolean
    default: true
    description: Keep enabled while preparing or reviewing a project. Turn it off only when the facts, imagery, public voice and both language versions are ready; drafts are excluded from routes and listings.

  project_image:
    label: Hero image
    type: object
    required: true
    fields:
      - name: src
        label: Image
        type: image
        required: true
        options:
          media: project_images
          categories: [image]
          extensions: [jpg, jpeg, png, webp, avif]
      - name: alt
        label: Alternative text
        type: text
        required: true
        description: Describe the image in the language of this project.

  project_metrics:
    label: Metrics
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{value} — {label}"
    fields:
      - name: value
        label: Value
        type: string
        required: true
      - name: label
        label: Label
        type: string
        required: true
      - name: detail
        label: Detail
        type: text

  project_gallery:
    label: Gallery
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{alt}"
    fields:
      - name: src
        label: Image
        type: image
        required: true
        options:
          media: project_images
          categories: [image]
          extensions: [jpg, jpeg, png, webp, avif]
      - name: alt
        label: Alternative text
        type: text
        required: true
      - name: caption
        label: Caption
        type: text

  project_external_url:
    label: External URL
    type: string

  project_external_label:
    label: External link label
    type: string

  project_tags:
    label: Tags
    type: string
    list: true

  project_body:
    label: Narrative
    type: rich-text
    required: true
    description: The primary case-study narrative, stored as Markdown after the frontmatter.
    options:
      format: markdown
      switcher: true
      media: false

  writing_title:
    label: Title
    type: string
    required: true

  writing_description:
    label: Description
    type: text
    required: true
    description: Localized standfirst used on the Writing or Notas index and in page metadata.

  writing_route_slug:
    label: Route slug
    type: string
    required: true
    pattern:
      regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      message: Use lowercase letters, numbers and single hyphens only.
    description: The localized article URL. Preserve it unless the public URL should intentionally change.

  writing_translation_key:
    label: Translation key
    type: string
    required: true
    description: Must match the corresponding article in the other language so translated routes can be paired.

  writing_published_at:
    label: Publication date
    type: date
    required: true
    options:
      format: yyyy-MM-dd

  writing_updated_at:
    label: Updated date
    type: date
    default: ""
    description: Optional. Use only when an article has been materially updated after publication.
    options:
      format: yyyy-MM-dd

  writing_draft:
    label: Draft
    type: boolean
    default: true
    description: Keep enabled until the article, translation, metadata and imagery have been reviewed. Drafts do not generate public routes.

  writing_category:
    label: Category
    type: string

  writing_tags:
    label: Tags
    type: string
    list: true

  writing_image:
    label: Hero image
    type: object
    fields:
      - name: src
        label: Image
        type: image
        required: true
        options:
          media: writing_images
          categories: [image]
          extensions: [jpg, jpeg, png, webp, avif]
      - name: alt
        label: Alternative text
        type: text
        required: true
        description: Describe the image in the language of this article.

  writing_related_project:
    label: Related project translation key
    type: string
    description: Optional. Use the shared translationKey of a published project; the localized URL is resolved automatically.

  writing_body:
    label: Article
    type: rich-text
    required: true
    description: The article body, stored as Markdown after the frontmatter.
    options:
      format: markdown
      switcher: true
      media: writing_images
      categories: [image]
      extensions: [jpg, jpeg, png, webp, avif]
      rename: safe

content:
  - name: projects_en
    label: Projects — English
    type: collection
    path: src/content/projects/en
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "{routeSlug}.md"
      field: false
    view:
      fields: [title, category, featured, order, draft]
      primary: title
      sort: [order, title]
      search: [title, description, category, tags]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        component: project_title
      - name: description
        component: project_description
      - name: locale
        label: Language
        type: select
        required: true
        readonly: true
        default: en
        description: Fixed for the English project collection.
        options:
          values:
            - name: en
              label: English (en)
      - name: routeSlug
        component: project_route_slug
      - name: translationKey
        component: project_translation_key
      - name: category
        component: project_category
